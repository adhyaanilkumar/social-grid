spring.application.name=social-grid

# Postgres running in the social-grid-db container. Env vars let Docker override these.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/socialgrid}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate creates/updates tables from the @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Run schema.sql (foreign keys) on every startup, after Hibernate has built the tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Origins allowed to call the API from a browser (the React app). Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Login sessions (AD-264). The session lives in server memory, so restarting the backend logs everyone out.
# Idle for 7 days -> expired. The cookie also lasts 7 days so a logged-in user survives a browser restart.
# SameSite=Lax stops other sites' POSTs from carrying the cookie (CSRF tokens are the main defence).
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
