# A template: at start-up the nginx image fills in ${AUTH_RATE_*} from the environment (see Dockerfile) and writes
# the result to /etc/nginx/conf.d/default.conf. nginx's own $variables are left alone.

# Rate limit for login and register (spec R2). Each one runs BCrypt, which is deliberately slow, so a script could
# otherwise use up the server's CPU. Only those two URLs get a key; an empty key means "not limited".
# Production sets AUTH_RATE_LIMIT=10r/m and AUTH_RATE_BURST=5. The image defaults are high, because the test
# suites register and log in hundreds of users from one address.
map $uri $auth_limit_key {
    ~^/api/auth/(login|register)$ $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=${AUTH_RATE_LIMIT};

server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind Caddy in production, the visitor's address arrives in X-Forwarded-For. Trust it only from private
    # (Docker network) addresses, so the rate limit counts per visitor and not "everyone is Caddy".
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Photo uploads. nginx's default is 1 MB, which would reject them before they reach Spring.
    client_max_body_size 6m;

    # Single-page app: unknown paths like /login fall back to index.html so React Router can handle them.
    location / {
        try_files $uri /index.html;
    }

    # API calls go to the Spring Boot container, so the browser sees one origin and sends the session cookie.
    # Pass the browser's Host (localhost:5173) through, so Spring sees Origin and Host match (same origin, no CORS).
    location /api/ {
        limit_req zone=auth burst=${AUTH_RATE_BURST} nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Forward Caddy's "https" as is, and send nothing when there's no Caddy (local Docker). Don't fall back to
        # $scheme: Tomcat would then treat the request as port 80, not localhost:5173, Spring would see it as
        # cross-origin, and CORS would reject every POST's X-XSRF-TOKEN header with 403 (the AD-246 failure).
        # nginx leaves out a header whose value is empty.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Built JS/CSS file names contain a content hash, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
