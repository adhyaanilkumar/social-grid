# On every merge to main: build both images and push them to GHCR, tagged with the commit SHA (short and full).
# The server only ever pulls these; it never builds (a Maven build can run out of memory on 2 GB).
# Tags are never reused, so "release <sha>" and "roll back to <sha>" always mean exactly that code.
# Branch protection means anything on main already passed the "ci" check.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's own token; no personal token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: social-grid-backend
            context: .
          - image: social-grid-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          # Links the package to this repo on GitHub, so it shows under the repo's Packages.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
