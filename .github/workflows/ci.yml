# The three CLAUDE.md gates on every PR to main: make build, make lint, make test. Same commands as on the laptop;
# the Makefile switches to plain mvn/npm/npx on Linux. Branch protection requires this "ci" check (deploy-plan.md D2).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run that's still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/blackbox/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r tests/blackbox/requirements.txt
          cd frontend && npm ci
        # Playwright uses channel 'chrome', and GitHub's Ubuntu runners come with Google Chrome installed.

      - name: make build
        run: make build

      - name: make lint
        run: make lint

      # JUnit (Testcontainers starts its own Postgres), then the Docker stack for pytest and Playwright.
      - name: make test
        run: make test

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
