# Runs the whole app: Postgres, the Spring Boot API and the React frontend.
#   docker compose up --build        -> everything
#   docker compose up -d postgres    -> just the database (for running backend/frontend locally)
services:
  postgres:
    image: postgres:18-alpine
    container_name: social-grid-db
    environment:
      POSTGRES_DB: socialgrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: social-grid-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/socialgrid
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: social-grid-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
